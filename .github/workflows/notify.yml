name: Nhắc lịch âm & ngày quan trọng

on:
  schedule:
    # 23:00 UTC = 06:00 sáng giờ VN (GMT+7). Cron của GitHub luôn theo UTC.
    - cron: "0 23 * * *"
  workflow_dispatch: {}   # cho phép bấm "Run workflow" để chạy thử thủ công

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          REMIND_DAYS: "7,3,1,0"
          DAILY_REPORT: "1"
